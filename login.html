
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080808">

    <title>DRIP FOUSE | Account</title>

    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <img
                src="assets/drip-fouse-logo.png"
                class="login-logo"
                alt="DRIP FOUSE"
            >

            <p class="gold-label">PREMIUM STREETWEAR</p>

            <h1>WELCOME BACK</h1>

            <p class="subtitle">
                Connectez-vous à votre compte DRIP FOUSE.
            </p>

            <button id="googleBtn" class="google-btn">
                <span>G</span> Continue with Google
            </button>

            <div class="separator">
                <span>OR</span>
            </div>

            <form id="loginForm">

                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    required
                >

                <button type="submit" class="submit-btn">
                    SIGN IN
                </button>

            </form>

            <p id="message"></p>

            <p class="register-text">
                Don't have an account?
                <a href="#" id="registerBtn">Create Account</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Store
            </a>

        </div>

    </main>

    <script type="module" src="auth.js"></script>

</body>
</html>
